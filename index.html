<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercícios de Funções em JavaScript</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      color: #1f2937;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 1.75rem;
      color: #111827;
      margin-bottom: 0.4rem;
    }

    header p {
      color: #4b5563;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 0.9rem;
      margin-bottom: 1.75rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .card h2 {
      font-size: 1rem;
      color: #111827;
    }

    .card code {
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 0.82rem;
      background: #f3f4f6;
      color: #2563eb;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    .card button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0.55rem 0.85rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .card button:hover {
      background-color: #1d4ed8;
    }

    .console-box {
      background: #111827;
      color: #e5e7eb;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.9rem;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid #374151;
      padding-bottom: 0.5rem;
    }

    .console-header span {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .console-header button {
      background: #374151;
      color: #f9fafb;
      border: none;
      border-radius: 4px;
      padding: 0.25rem 0.6rem;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .console-header button:hover {
      background: #4b5563;
    }

    #saida {
      min-height: 90px;
      white-space: pre-wrap;
      color: #34d399;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Exercícios: Funções e Entrada de Dados com <code>prompt()</code></h1>
      <p>
        Clique em qualquer exercício para executá-lo. Os resultados aparecem no
        <strong>Console do navegador (F12)</strong> e também na área de saída abaixo.
      </p>
    </header>

    <main class="grid" id="lista-exercicios"></main>

    <section class="console-box">
      <div class="console-header">
        <span>Saída do console.log()</span>
        <button type="button" id="limpar-saida">Limpar</button>
      </div>
      <div id="saida">Clique em um exercício acima para testar...</div>
    </section>
  </div>

  <script>
    const exercicios = [
      { id: 1, titulo: "Exercício 1: Saudação", funcao: "saudacao(nome)", arquivo: "exercicios/ex01-saudacao.js" },
      { id: 2, titulo: "Exercício 2: O dobro", funcao: "dobro(numero)", arquivo: "exercicios/ex02-dobro.js" },
      { id: 3, titulo: "Exercício 3: Soma de dois números", funcao: "soma(a, b)", arquivo: "exercicios/ex03-soma.js" },
      { id: 4, titulo: "Exercício 4: Par ou ímpar", funcao: "ehPar(numero)", arquivo: "exercicios/ex04-par-ou-impar.js" },
      { id: 5, titulo: "Exercício 5: Maior de dois", funcao: "maiorDeDois(a, b)", arquivo: "exercicios/ex05-maior-de-dois.js" },
      { id: 6, titulo: "Exercício 6: Média de notas", funcao: "calcularMedia(n1, n2, n3)", arquivo: "exercicios/ex06-media-notas.js" },
      { id: 7, titulo: "Exercício 7: Área do retângulo", funcao: "areaRetangulo(base, altura)", arquivo: "exercicios/ex07-area-retangulo.js" },
      { id: 8, titulo: "Exercício 8: Celsius para Fahrenheit", funcao: "celsiusParaFahrenheit(c)", arquivo: "exercicios/ex08-celsius-fahrenheit.js" },
      { id: 9, titulo: "Exercício 9: Desconto", funcao: "calcularDesconto(preco, percentual)", arquivo: "exercicios/ex09-desconto.js" },
      { id: 10, titulo: "Exercício 10: Maioridade", funcao: "verificarIdade(idade)", arquivo: "exercicios/ex10-maioridade.js" },
    ];

    const listaEl = document.getElementById("lista-exercicios");
    const saidaEl = document.getElementById("saida");
    const limparBtn = document.getElementById("limpar-saida");
    let logs = [];

    function registrarSaida(titulo, texto) {
      logs.push(`[${titulo}] ${texto}`);
      saidaEl.textContent = logs.join("\n");
    }

    function executarExercicio(ex) {
      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      document.body.appendChild(iframe);

      const win = iframe.contentWindow;
      const doc = iframe.contentDocument;

      win.console.log = function (...args) {
        console.log(...args);
        registrarSaida(ex.titulo, args.join(" "));
      };

      const urlScript = new URL(ex.arquivo, window.location.href).href;
      const script = doc.createElement("script");
      script.src = urlScript;
      script.onload = () => setTimeout(() => iframe.remove(), 0);
      script.onerror = () => {
        registrarSaida(ex.titulo, "Erro ao carregar o arquivo " + ex.arquivo);
        iframe.remove();
      };
      doc.body.appendChild(script);
    }

    exercicios.forEach((ex) => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div>
          <h2>${ex.titulo}</h2>
          <code>${ex.funcao}</code>
        </div>
        <button type="button">Executar</button>
      `;
      card.querySelector("button").addEventListener("click", () => executarExercicio(ex));
      listaEl.appendChild(card);
    });

    limparBtn.addEventListener("click", () => {
      logs = [];
      saidaEl.textContent = "Saída limpa.";
    });
  </script>
</body>
</html>
